name: verify

on:
  push:
    branches-ignore:
      - main

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Maven setup
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
              "id": "magnolia.enterprise.group",
              "username": "${{secrets.MGNL_NEXUS_USER}}",
              "password": "${{secrets.MGNL_NEXUS_PASS}}"
            }]
      - name: Maven verify
        run: ./mvnw verify --batch-mode
  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version-file: ./magnolia-flexible-image-frontend/.nvmrc
      - name: Node verify
        working-directory: ./magnolia-flexible-image-frontend
        run: npm ci && npm run build && npm run lint && npm run test
